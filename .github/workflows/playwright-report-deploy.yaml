name: Playwright Report Deploy
on:
  workflow_run:
    # "Playwright E2E Tests" now runs as a job inside the reusable ci-web.yaml
    # workflow, called from the top-level "CI" workflow (sentinel.yaml). Only
    # "CI" itself is a directly-triggered workflow that can be targeted here.
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy Playwright Report to Surge
    runs-on: ubuntu-22.04
    # Only run on pull request events
    if: github.event.workflow_run.event == 'pull_request'

    permissions:
      # Required to post comments on PRs
      pull-requests: write
      # Required for checkout
      contents: read

    steps:
    # The "CI" run may not have executed the Playwright job at all (e.g. a
    # Go/Python-only PR never calls ci-web.yaml), so no artifacts will exist.
    # Treat that as a normal skip rather than a failure.
    - name: Download Playwright report artifact
      id: download-report
      uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
      with:
        name: playwright-report
        workflow: ci-web.yaml
        run_id: ${{ github.event.workflow_run.id }}
        path: ./playwright-report
        if_no_artifact_found: ignore

    - name: Download PR number
      id: download-pr-info
      uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
      with:
        name: pr-info
        workflow: ci-web.yaml
        run_id: ${{ github.event.workflow_run.id }}
        path: ./pr-info
        if_no_artifact_found: ignore

    # pr-info is written by the PR's own run, so a fork controls it. Trust the
    # number only when it names an open PR whose head matches this CI run.
    - name: Read PR number
      id: pr
      if: steps.download-pr-info.outputs.found_artifact == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const run = context.payload.workflow_run;
          let raw;
          try {
            raw = fs.readFileSync('pr-info/pr_number.txt', 'utf8').trim();
          } catch (err) {
            core.warning(`pr_number.txt is unreadable (${err.code}); skipping deploy`);
            return;
          }
          if (!/^[0-9]{1,10}$/.test(raw)) {
            core.warning('pr_number.txt does not hold a PR number; skipping deploy');
            return;
          }
          const number = Number(raw);
          let pr;
          try {
            ({ data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            }));
          } catch (err) {
            core.warning(`PR #${number} lookup failed (${err.status}); skipping deploy`);
            return;
          }
          if (pr.state !== 'open') {
            core.warning(`PR #${number} is ${pr.state}; skipping deploy`);
            return;
          }
          if (!pr.head.repo || pr.head.repo.full_name !== run.head_repository?.full_name ||
              pr.head.ref !== run.head_branch) {
            core.warning(`PR #${number} head does not match this CI run's head; skipping deploy`);
            return;
          }
          core.setOutput('number', String(number));

    - name: Install Surge CLI
      if: steps.download-report.outputs.found_artifact == 'true' && steps.download-pr-info.outputs.found_artifact == 'true' && steps.pr.outputs.number != ''
      run: npm install -g surge

    - name: Deploy to Surge
      id: deploy
      if: steps.download-report.outputs.found_artifact == 'true' && steps.download-pr-info.outputs.found_artifact == 'true' && steps.pr.outputs.number != ''
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      run: |
        DEPLOY_DOMAIN="quay-playwright-pr-${PR_NUMBER}.surge.sh"
        surge ./playwright-report "$DEPLOY_DOMAIN" --token "$SURGE_TOKEN"
        echo "url=https://$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"

    - name: Comment PR with report URL
      if: steps.deploy.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_URL: ${{ steps.deploy.outputs.url }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      with:
        script: |
          const reportUrl = process.env.REPORT_URL;
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          const conclusion = process.env.RUN_CONCLUSION;
          const runUrl = process.env.RUN_URL;
          const headSha = process.env.HEAD_SHA;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Playwright Test Report')
          );

          const statusEmoji = conclusion === 'success' ? '✅' : '❌';
          const statusText = conclusion === 'success' ? 'passed' : 'failed';

          const commentBody = `## Playwright Test Report

          ${statusEmoji} **Tests ${statusText}**

          📊 **[View Full Report](${reportUrl})**

          🔗 [View Workflow Run](${runUrl})

          _Report from commit ${headSha}_`;

          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
          }
