# Squid for the proxy-cache e2e phase in ci-web.yaml.
# registry-denied is an alias of the same upstream registry: its manifests
# pass and its blobs are refused, so a denied blob must fail fast in Quay.
http_port 3128

acl upstream_registry dstdomain registry-upstream registry-denied
acl denied_registry dstdomain registry-denied
acl blob_path urlpath_regex ^/v2/.+/blobs/

http_access deny denied_registry blob_path
http_access allow upstream_registry
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
buffered_logs off
pinger_enable off
