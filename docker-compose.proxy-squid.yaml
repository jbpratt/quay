# Routes Quay's outbound HTTP through Squid for the proxy-cache e2e phase in
# ci-web.yaml. The upstream registry sits on a network Quay
# does not join, so any request that bypasses Squid fails to resolve it.
#
#   docker compose -f docker-compose.yaml -f docker-compose.proxy-squid.yaml \
#     up -d squid registry-upstream
services:
  squid:
    container_name: quay-squid
    image: docker.io/ubuntu/squid@sha256:3de2e64f0ca6efdac3e98557607dc0f23050037f3885016d5d5bfcf9950501b8
    volumes:
      - "./.github/squid/squid.conf:/etc/squid/squid.conf:ro"
    networks:
      - default
      - upstream

  registry-upstream:
    container_name: quay-registry-upstream
    image: docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    ports:
      # Host-only port so the test can seed images.
      - "127.0.0.1:5001:5000"
    networks:
      upstream:
        aliases:
          - registry-denied

  quay:
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: &no_proxy localhost,127.0.0.1,quay-db,quay-redis,quay-mailpit,garage,jaeger,host.docker.internal,host.containers.internal
      no_proxy: *no_proxy

networks:
  default: {}
  upstream: {}
