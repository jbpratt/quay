# Non-secret Quay application config baseline for CI jobs generated by
# ci-generator. The quay-copy-app-config release step copies this file into
# SHARED_DIR; quay-deploy-aws-s3 uses it as the base config and layers
# infrastructure-only QUAY_EXTRA_CONFIG, runtime storage/service groups,
# managed-field filtering and the builder overlay on top. Keys here must not
# carry storage, redis connection settings, mail, tracing, hostname/TLS, DB,
# scanner, mirror or secret values.
CREATE_PRIVATE_REPO_ON_PUSH: true
CREATE_NAMESPACE_ON_PUSH: true
FEATURE_EXTENDED_REPOSITORY_NAMES: true
FEATURE_QUOTA_MANAGEMENT: true
FEATURE_AUTO_PRUNE: true
FEATURE_PROXY_CACHE: true
FEATURE_USER_INITIALIZE: true
PERMANENTLY_DELETE_TAGS: true
RESET_CHILD_MANIFEST_EXPIRATION: true
FEATURE_PROXY_STORAGE: true
FEATURE_SUPERUSER_CONFIGDUMP: true
FEATURE_UI_V2: true
FEATURE_SUPERUSERS_FULL_ACCESS: true
FEATURE_UI_MODELCARD: true
SUPER_USERS:
  - quay
  - admin
GLOBAL_READONLY_SUPER_USERS:
  - readonly
FEATURE_ANONYMOUS_ACCESS: true
BROWSER_API_CALLS_XHR_ONLY: false
FEATURE_USERNAME_CONFIRMATION: false
AUTHENTICATION_TYPE: Database
FEATURE_LISTEN_IP_VERSION: IPv4
REPO_MIRROR_ROLLBACK: false
AUTOPRUNE_TASK_RUN_MINIMUM_INTERVAL_MINUTES: 1
FEATURE_IMAGE_EXPIRY_TRIGGER: true
NOTIFICATION_TASK_RUN_MINIMUM_INTERVAL_MINUTES: 1
DEFAULT_TAG_EXPIRATION: 2w
TAG_EXPIRATION_OPTIONS:
  - 2w
  - 4w
  - 8w
  - 1d
REDIS_FLUSH_INTERVAL_SECONDS: 30
FEATURE_IMAGE_PULL_STATS: false
FEATURE_ORG_MIRROR: true
FEATURE_IMMUTABLE_TAGS: true
FEATURE_PROGRAMMATIC_BOOTSTRAP: false
FEATURE_USER_METADATA: true
FEATURE_SPARSE_INDEX: true
FEATURE_QUOTA_NOTIFICATIONS: true
FEATURE_EDIT_QUOTA: true
FEATURE_CHANGE_TAG_EXPIRATION: true
SESSION_TIMEOUT: 2h
DEFAULT_UI: react
